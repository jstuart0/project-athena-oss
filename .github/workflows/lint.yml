name: Lint

# Correctness lint (undefined names, shadowing redefinitions, syntax errors)
# over the three Python trees, with ruff from a hash-locked requirements file.
# No `paths:` filter, so a file outside the trees can't skip it; the config and
# the workflow are pinned by tests/unit/test_lint_gate.py.
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: ruff (F821, F822, F823, F811, E9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install lint dependencies (hash-locked)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes -r .github/ci-requirements/lint/requirements.txt

      - name: Run ruff
        shell: bash
        run: |
          ruff check --no-cache src admin/backend/app apps

      - name: Run the lint gate test
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_lint_gate.py
