name: Version consistency

# Every __version__ site and src/shared/pyproject.toml equal the CHANGELOG's
# latest release heading, and admin-backend's FastAPI app.version reads
# shared.__version__ (the version install telemetry reports).

on:
  pull_request:
    paths:
      - "src/shared/__init__.py"
      - "src/shared/pyproject.toml"
      - "src/gateway/__init__.py"
      - "src/jetson/__init__.py"
      - "src/control_agent/__init__.py"
      - "CHANGELOG.md"
      - "admin/backend/main.py"
      - "tests/unit/test_version_consistency.py"
      - ".github/workflows/version-consistency.yml"
  push:
    branches: [main]
    paths:
      - "src/shared/__init__.py"
      - "src/shared/pyproject.toml"
      - "src/gateway/__init__.py"
      - "src/jetson/__init__.py"
      - "src/control_agent/__init__.py"
      - "CHANGELOG.md"
      - "admin/backend/main.py"
      - "tests/unit/test_version_consistency.py"
      - ".github/workflows/version-consistency.yml"

permissions:
  contents: read

jobs:
  versions:
    name: version sites agree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install (hash-locked)
        run: |
          python -m pip install --require-hashes -r admin/backend/requirements-test.txt
          python -m pip install --no-deps -e src/shared

      - name: Version sites match the CHANGELOG release
        run: python -m pytest tests/unit/test_version_consistency.py -q -p no:cacheprovider
