name: Source Guards

# Source-level drift guards plus the behaviour tests behind them:
#
# - guards: stdlib-only scans that fail when a process-TZ clock read, a
#   logged name/address/location/phone number, or an unaccepted
#   caller_trust value appears anywhere in the tree (not just in files a
#   paths: filter would guess at, so there is none).
# - orchestrator-behaviour / jarvis-web-behaviour / sports-behaviour: the
#   tests for the local clock, the repetition detector, the addressee rules,
#   the caller classes and the sports date windows, each under its own
#   image's hash-locked requirements.
# - admin-backend-auth: every admin-backend route carries a permission-bearing
#   auth dependency or is on a reviewed list, the gated routes' credential
#   matrix, the orchestrator-to-admin seam, SMS matching and replay, and the
#   admin-backend log hygiene, under admin-backend's hash-locked test lock.
#
# Every job reads pytest's own exit status (no pipes).
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    name: Clock, PII and trust-value guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test dependencies (hash-locked)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes -r .github/ci-requirements/unit-min/requirements.txt
          python3 -m pip install --no-deps -e src/shared

      - name: Run the guards
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_local_clock_drift.py tests/unit/test_model_literal_drift.py tests/unit/test_no_pii_in_logs.py tests/unit/test_trust_literal_contract.py tests/unit/test_knowledge_tiers.py tests/unit/test_base_knowledge_tier_parity.py tests/unit/test_knowledge_reader_population.py tests/unit/test_session_key_drift.py tests/unit/test_owner_session_ids.py tests/unit/test_admin_guest_route_callers_send_service_key.py tests/unit/test_admin_frontend_gated_fetch_auth.py tests/unit/test_admin_frontend_nginx_api_access_log.py tests/unit/test_admin_jarvis_ticket_only.py tests/unit/test_voice_automations_js_escaping.py tests/unit/test_conversations_js_escaping.py tests/unit/test_admin_frontend_api_errors.py tests/unit/test_admin_frontend_capture_settings.py tests/unit/test_admin_frontend_capture_toasts.py tests/unit/test_emerging_intents_js_withheld.py tests/unit/test_ha_consolidation_drift.py tests/unit/test_llm_direct_ollama_drift.py tests/unit/test_model_json_strip.py tests/unit/test_access_target_drift.py

  orchestrator-behaviour:
    name: Orchestrator behaviour tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the orchestrator's locked requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes -r src/orchestrator/requirements.txt -r src/orchestrator/requirements-test.txt
          python3 -m pip install --require-hashes -r .github/ci-requirements/jarvis-route-census/pins.txt
          python3 -m pip install --no-deps -e src/shared

      - name: Run the behaviour tests
        shell: bash
        run: |
          # Order matters: test_room_directory_provider.py captures logs, and any Chat-harness test that runs before it caches its logger.
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_helpers.py tests/unit/test_finalize.py tests/unit/test_local_time.py tests/unit/test_base_knowledge_clock.py tests/unit/test_date_extraction_local.py tests/unit/test_planning_prompt_local_date.py tests/unit/test_gateway_simple_commands_clock.py tests/unit/test_sequence_wait_local.py tests/unit/test_prompt_clock_sites.py tests/unit/test_addressee_matrix.py tests/unit/test_knowledge_audience_matrix.py tests/unit/test_owner_proof.py tests/unit/test_knowledge_mixed_version.py tests/unit/test_owner_session_partition.py tests/unit/test_knowledge_readers_seam.py tests/unit/test_knowledge_tiers.py tests/unit/test_trust_classification.py tests/unit/test_assistant_profile_household.py tests/unit/test_semantic_cache_addressee.py tests/unit/test_base_knowledge_names.py tests/unit/test_public_caller_orchestrator.py tests/unit/test_logging_quiet_request_urls.py tests/unit/test_automation_agent_scope.py tests/unit/test_sms_stay_phase_authorization.py tests/unit/test_service_key_headers.py tests/unit/test_reviewed_route_callers_wire.py tests/unit/test_tv_launch_with_app_configs.py tests/unit/test_admin_config_service_key_validity.py tests/unit/test_admin_call_path_segments.py tests/unit/test_smart_home_admin_calls.py tests/unit/test_stuck_sensor_detection.py tests/unit/test_room_light_resolution.py tests/unit/test_room_light_dispatch.py tests/unit/test_tts_normalizer.py tests/unit/test_output_channel.py tests/unit/test_speech_rendering_routes.py tests/unit/test_gateway_output_channel.py tests/unit/test_fast_path.py tests/unit/test_fast_path_routes.py tests/unit/test_fast_path_pending_defer.py tests/unit/test_fast_path_wiring.py tests/unit/test_gateway_routing_call.py tests/unit/test_gateway_prerouting_fast_path.py tests/unit/test_background_tasks.py tests/unit/test_short_answer_rules.py tests/unit/test_ambient_fragment_gate.py tests/unit/test_voice_length_cap.py tests/unit/test_answer_token_cap_sites.py tests/unit/test_answer_token_cap_wiring.py tests/unit/test_llm_sdk_stop_reason.py tests/unit/test_llm_backend_usage_parsers.py tests/unit/test_llm_prompt_tokens.py tests/unit/test_openai_usage.py tests/unit/test_gateway_usage_passthrough.py tests/unit/test_gateway_metric_prompt_tokens.py tests/unit/test_openai_session_key.py tests/unit/test_model_safe_errors.py tests/unit/test_model_safe_success_payloads.py tests/unit/test_model_safe_error_paths.py tests/unit/test_model_safe_error_wiring.py tests/unit/test_rag_client_dc9.py tests/unit/test_llm_router_stream_parity.py tests/unit/test_llm_context_plan.py tests/unit/test_llm_router_context_wiring.py tests/unit/test_llm_strict_callers.py tests/unit/test_orchestrator_entrypoint_import.py::test_orchestrator_entrypoint_imports_cleanly tests/unit/test_orchestrator_entrypoint_import.py::test_gateway_entrypoint_imports_cleanly tests/unit/test_orchestrator_entrypoint_import.py::test_orchestrator_modules_import_cleanly_in_any_first_position tests/unit/test_orchestrator_entrypoint_import.py::test_the_first_import_check_detects_a_cycle tests/unit/test_conversation_capture_contract.py tests/unit/test_turn_capture.py tests/unit/test_conversation_capture_routes.py tests/unit/test_conversation_capture_drift.py tests/unit/test_intent_discovery_privacy.py tests/unit/test_write_fanout_confirmation.py tests/unit/test_state_question_routing.py tests/unit/test_ha_permission_wiring.py tests/unit/test_ha_permission_guard.py tests/unit/test_mode_permission.py tests/unit/test_public_refusal_wording.py tests/unit/test_ha_refusal_wiring.py tests/unit/test_ha_door_read_timeout.py tests/unit/test_smart_home_controller_permissions.py tests/unit/test_smart_home_light_group_fallback.py tests/unit/test_gateway_session_forwarding.py tests/unit/test_ha_registry.py tests/unit/test_ha_registry_ws_protocol.py tests/unit/test_ha_link.py tests/unit/test_ha_link_truth_table.py tests/unit/test_orchestrator_callers_send_service_key.py tests/unit/test_room_context.py tests/unit/test_room_directory_provider.py tests/unit/test_extract_intent_room_mentions.py tests/unit/test_exclusion_vocabulary.py tests/unit/test_smart_home_intent_prompt.py tests/unit/test_access_target.py tests/unit/test_access_intent_policy.py tests/unit/test_sequence_step_params.py tests/unit/test_sequence_step_clauses.py tests/unit/test_write_cue.py tests/unit/test_room_vocabulary_drift.py tests/unit/test_gateway_speaker_room.py tests/unit/test_gateway_simple_commands_routing.py tests/unit/test_openai_device_followup.py tests/unit/test_room_light_area_tier.py tests/unit/test_light_reply_no_enumeration.py tests/unit/test_room_decision_contract.py tests/unit/test_room_followups.py tests/unit/test_room_choice.py tests/unit/test_room_context_degraded.py tests/unit/test_room_context_isolation.py tests/unit/test_room_reads_and_controls.py tests/unit/test_motion_control_rooms.py tests/unit/test_room_context_pipeline.py tests/unit/test_room_probe.py tests/unit/test_route_control.py tests/unit/test_url_safety_service_host.py tests/unit/test_ha_credentials.py tests/unit/test_ha_auth_latch.py tests/unit/test_ha_http.py tests/unit/test_ha_ws.py tests/unit/test_ha_auth_bound_end_to_end.py tests/unit/test_ha_link_wire_compat.py tests/unit/test_ha_secret_hygiene.py tests/unit/test_campaign_ci_wiring.py tests/unit/test_room_directory_refresh.py tests/unit/test_ha_docs_match_constants.py tests/unit/test_ha_admin_config_tool_keys.py tests/unit/test_ha_client_over_the_channel.py tests/unit/test_context_detector_dining.py tests/unit/test_semantic_cache_audience.py tests/unit/test_bench_observability.py tests/unit/test_identity_answer.py tests/unit/test_identity_routes.py tests/unit/test_synthesize.py tests/unit/test_rag_url_reachability.py tests/unit/test_sports_status.py tests/unit/test_clause_rule.py tests/unit/test_command_text.py tests/unit/test_extract_command_text.py tests/unit/test_imperative_never_read.py tests/unit/test_media_scene_cue.py tests/unit/test_grounding.py tests/unit/test_tool_call_grounding.py tests/unit/test_answer_route.py tests/unit/test_access_lock.py tests/unit/test_entity_freshness.py tests/unit/test_occupancy_answer.py tests/unit/test_followup.py tests/unit/test_followup_wiring.py tests/unit/test_agent_gate.py tests/unit/test_entity_repair.py tests/unit/test_intent_arbitration.py

      # Each of these replaces orchestrator.config_loader (or prometheus_client)
      # in sys.modules for the rest of its process, so each runs alone, one
      # pytest command per file.
      - name: Run the validate node tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_validate.py

      - name: Run the retrieve node tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_retrieve.py

      - name: Run the context continuation tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_context_continuation.py

      - name: Run the music node tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_route_music.py

      - name: Run the gateway non-stream continuity tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_gateway_nonstream_continuity.py

      - name: Run the gateway spoken-failure tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_gateway_spoken_failure.py

      - name: Run the health probe tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_health_probes.py

      - name: Run the Home Assistant status route tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_orchestrator_ha_status_route.py

      - name: Run the orchestrator ingress auth tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_orchestrator_ingress_auth.py

      - name: Run the gateway health tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_gateway_health_no_ha_requests.py

      - name: Run the gateway Home Assistant channel tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_gateway_ha_channel.py

      # The sports case needs feedparser, which only the sports image
      # carries; the sports-behaviour job runs it.
      - name: Run the RAG date tests (without sports)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_rag_local_dates.py -k "not sports"

  jarvis-web-behaviour:
    name: jarvis-web behaviour tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install jarvis-web's locked requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes -r apps/jarvis-web/backend/requirements.txt -r apps/jarvis-web/backend/requirements-test.txt

      - name: Run the behaviour tests
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_jarvis_web_speaker_name.py tests/unit/test_jarvis_web_owner.py tests/unit/test_jarvis_trust_contract.py tests/unit/test_owner_session_ids.py tests/unit/test_jarvis_web_addressee_matrix.py tests/unit/test_jarvis_web_edge_mode.py tests/unit/test_jarvis_web_caller_classes.py tests/unit/test_jarvis_web_caller_mode.py tests/unit/test_jarvis_web_relay.py tests/unit/test_edge_template_contract.py tests/unit/test_reviewed_route_callers_wire.py tests/unit/test_jarvis_web_service_key_header.py tests/unit/test_jarvis_web_tts_normalization.py

  sports-behaviour:
    name: Sports RAG date-window test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the sports image's locked requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes -r src/rag/sports/requirements.txt -r src/rag/sports/requirements-test.txt
          python3 -m pip install --no-deps -e src/shared

      # The test skips without feedparser; prove it can't skip here.
      - name: Check the sports dependency is importable
        shell: bash
        run: |
          python3 -c "import feedparser"

      - name: Run the sports date test
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider "tests/unit/test_rag_local_dates.py::test_sports_window_keeps_tonights_event"

  media-behaviour:
    name: Media RAG Overseerr settings and failures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the media image's locked requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes -r src/rag/media/requirements.txt -r src/rag/media/requirements-test.txt
          python3 -m pip install --no-deps -e src/shared

      - name: Run the media tests
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/unit/test_media_rag_seerr.py

  admin-backend-auth:
    name: Admin-backend route auth and guest data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin/backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install admin-backend's locked test requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes -r requirements-test.txt
          python3 -m pip install --no-deps -e ../../src/shared

      - name: Run the route-auth and guest-data tests
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/test_route_auth_population.py tests/test_route_walk_admin.py tests/test_calendar_sources_auth.py tests/test_guest_routes_auth.py tests/test_admin_config_real_seam.py tests/test_sms_phone_match.py tests/test_sms_webhook_signature.py tests/test_sms_session_id.py tests/test_settings_ollama_url_ssrf.py tests/test_access_log_quiet.py tests/test_ws_ticket_only.py tests/test_migration_063_stay_scope.py tests/test_model_download_callback_base.py tests/test_auth_rejection_log.py tests/test_reviewed_routes_auth.py tests/test_base_knowledge_tiers.py tests/test_app_modules_restored.py tests/test_voice_response_settings.py tests/test_guardrail_defaults_parity.py tests/test_llm_metric_prompt_tokens.py tests/test_internal_error_details.py tests/test_conversation_capture_routes.py tests/test_alembic_single_head.py tests/test_voice_interface_debug_mode_contract.py tests/test_analytics_log_no_text.py tests/test_pipeline_event_allowlist.py tests/test_exit_guard.py tests/test_emerging_intents_sample_text.py tests/test_service_monitoring_state.py tests/test_registry_status_read_sites.py tests/test_ha_status_classify.py tests/test_ha_status_route.py tests/test_system_status_registry.py tests/test_rag_url_resolution.py tests/test_service_run_state.py tests/test_ha_access.py tests/test_ha_key_write_boundary.py tests/test_ha_pipelines_routes.py tests/test_room_tv_audio_ha_channel.py tests/test_ha_status_v1_reader_compat.py tests/test_dashboard_not_checked.py tests/test_service_urls_accessor.py tests/test_core_probe.py tests/test_stuck_sensor_alerts.py tests/test_ha_key_not_injectable.py tests/test_oss_profiles_context.py ../../tests/unit/test_url_safety_service_host.py

      # These two set SERVICE_API_KEY and DEV_MODE at import, which would change
      # the key every other test in their process expects, so each runs alone.
      # They cover the poller's timestamp writer and the dashboard roll-up.
      - name: Run the health poller tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/test_phase4_health_poller.py

      - name: Run the dashboard health tests (own process)
        shell: bash
        run: |
          python3 -m pytest -q -p no:cacheprovider tests/test_athena_112_dashboard_health.py
