name: Install telemetry

# admin-backend's pseudonymous install telemetry: schema, classifiers, fact
# collection, sender (lease, cadence, privacy), Admin API, docs parity, and
# the lease/ID race on real Postgres 16.

on:
  pull_request:
    paths:
      - "admin/backend/app/services/telemetry/**"
      - "admin/backend/app/routes/telemetry.py"
      - "admin/backend/tests/test_telemetry_*.py"
      - "admin/backend/tests/integration/test_telemetry_postgres.py"
      - "admin/backend/tests/fixtures/telemetry/**"
      - "docs/telemetry/**"
      - "docs/CONFIGURATION.md"
      - "README.md"
      - "src/shared/config.py"
      - "admin/backend/main.py"
      - "admin/backend/app/services/settings_lease.py"
      - "admin/frontend/telemetry.js"
      - "admin/frontend/system-config.js"
      - ".github/workflows/telemetry.yml"
  push:
    branches: [main]
    paths:
      - "admin/backend/app/services/telemetry/**"
      - "admin/backend/app/routes/telemetry.py"
      - "admin/backend/tests/test_telemetry_*.py"
      - "admin/backend/tests/integration/test_telemetry_postgres.py"
      - "admin/backend/tests/fixtures/telemetry/**"
      - "docs/telemetry/**"
      - "docs/CONFIGURATION.md"
      - "README.md"
      - "src/shared/config.py"
      - "admin/backend/main.py"
      - "admin/backend/app/services/settings_lease.py"
      - "admin/frontend/telemetry.js"
      - "admin/frontend/system-config.js"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: read

jobs:
  unit:
    name: telemetry unit tier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install (hash-locked)
        run: |
          python -m pip install --require-hashes -r admin/backend/requirements-test.txt
          python -m pip install --no-deps -e src/shared

      - name: Telemetry tests, lease and route walk (floor 7, named members)
        working-directory: admin/backend
        run: >
          python -c "import subprocess,sys,glob;
          fs=sorted(glob.glob('tests/test_telemetry_*.py'));
          assert len(fs)>=7, fs;
          assert 'tests/test_telemetry_privacy.py' in fs and 'tests/test_telemetry_sender.py' in fs, fs;
          sys.exit(subprocess.run([sys.executable,'-m','pytest',*fs,'tests/test_settings_lease.py','tests/test_route_walk_admin.py','-q','-p','no:cacheprovider'],timeout=900).returncode)"

  integration:
    name: telemetry on Postgres 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54 # 16, multi-arch index
        env:
          POSTGRES_PASSWORD: t
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install (hash-locked)
        run: |
          python -m pip install --require-hashes -r admin/backend/requirements-test.txt
          python -m pip install --no-deps -e src/shared

      - name: Wait for Postgres
        run: pg_isready -h localhost -p 5432 -t 30

      - name: Lease and ID race on real Postgres
        working-directory: admin/backend
        env:
          POSTGRES_TEST_URL: postgresql://postgres:t@localhost:5432/postgres
        run: python -m pytest -m integration tests/integration/test_telemetry_postgres.py -q -p no:cacheprovider
