name: Admin Frontend Escaping (ATHENA-67)

# Guards the shared HTML/JS escaping helpers in admin/frontend/escape-html.js
# and their load order in admin/frontend/index.html. A regression here is a
# live XSS on the authenticated admin surface — see ATHENA-67.

on:
  pull_request:
    paths:
      - "admin/frontend/**"
      - "tests/unit/test_admin_frontend_escaping.py"
      - "tests/unit/test_frontend_guard_scripts.py"
      - "scripts/_frontend_escape_scan.py"
      - "scripts/check-frontend-escape-load-order.js"
      - "scripts/check-frontend-cache-busters.py"
      - "scripts/check-escape-html-uniqueness.py"
      - "scripts/check-handler-escaping.py"
      - "scripts/check-callee-sinks.py"
      - "scripts/check-html-template-escaping.py"
      - "scripts/check-frontend-wiring.py"
      - "scripts/check-no-new-test-skips.py"
      - ".github/workflows/frontend-escaping.yml"
  push:
    branches: [main]
    paths:
      - "admin/frontend/**"
      - "tests/unit/test_admin_frontend_escaping.py"
      - "tests/unit/test_frontend_guard_scripts.py"
      - "scripts/_frontend_escape_scan.py"
      - "scripts/check-frontend-escape-load-order.js"
      - "scripts/check-frontend-cache-busters.py"
      - "scripts/check-escape-html-uniqueness.py"
      - "scripts/check-handler-escaping.py"
      - "scripts/check-callee-sinks.py"
      - "scripts/check-html-template-escaping.py"
      - "scripts/check-frontend-wiring.py"
      - "scripts/check-no-new-test-skips.py"
      - ".github/workflows/frontend-escaping.yml"

permissions:
  contents: read

jobs:
  frontend-escaping:
    name: escape-html.js behavior + load-order guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # merge-base needs real history; the default shallow clone breaks
          # scripts/check-frontend-cache-busters.py
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.8.0"

      - name: Resolve Node interpreter (D3 — pinned, not PATH-guessed)
        shell: bash
        run: |
          set -euo pipefail
          node --version
          echo "ATHENA_NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
          # CI must never take the developer-laptop skip path (D3): a
          # missing/broken node interpreter is a hard failure here, not a
          # silent module-wide skip (catalogue instance 7).
          echo "ATHENA_REQUIRE_NODE=1" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest

      - name: Run escaping behavioral tests (zero skips permitted — ATHENA_REQUIRE_NODE=1)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest tests/unit/test_admin_frontend_escaping.py -v

      - name: Assert escaping contract has zero skips (returncode read first — tessa F1)
        shell: bash
        run: |
          set -euo pipefail
          # rule 7 / rule 10: read the PIPESTATUS of pytest itself, not tee's
          # exit status, and never let a text-match for "SKIPPED" stand in
          # for the returncode. A real failure that never prints "SKIPPED"
          # must still be caught — by the returncode, read first.
          python3 -m pytest tests/unit/test_admin_frontend_escaping.py -q -rs | tee /tmp/pytest-zero-skips.txt
          RC="${PIPESTATUS[0]}"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: pytest exited $RC"
            exit 1
          fi
          if grep -q "SKIPPED" /tmp/pytest-zero-skips.txt; then
            echo "FAIL: a SKIPPED test was reported under ATHENA_REQUIRE_NODE=1 — this must be impossible"
            exit 1
          fi
          echo "PASS: zero skips, pytest returncode 0"

      - name: Run guard-script unit tests (Phase 1 fixtures)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest tests/unit/test_frontend_guard_scripts.py -v

      - name: Exactly one file defines escapeHtml/escapeJsAttr (Phase 5, absolute)
        shell: bash
        run: |
          set -euo pipefail
          # Phase 1's original step here was `--check baseline-floor
          # --min-definitions 18 --named-member 'admin/frontend/utils.js:20'`
          # -- a ONE-TIME vacuity check against Phase 1's starting population
          # (18 non-canonical definitions still awaiting deletion). Phase 5
          # deleted all 18 by design, so that check now permanently fails
          # (2 < 18) and its named member no longer exists -- a gate that
          # outlived the state it was written to protect (Phase 7 found
          # this red on the tree; fixed here rather than left to rot).
          # Replaced with the actual permanent invariant this campaign
          # delivers.
          python3 scripts/check-escape-html-uniqueness.py --check definitions \
            --expect 2 --in admin/frontend/escape-html.js
          python3 scripts/check-escape-html-uniqueness.py --check body-shape
          python3 scripts/check-escape-html-uniqueness.py --check entity-map-shape \
            --exclude-path admin/frontend/escape-html.js

      - name: Handler-text builder set pinned by set-equality (D9b)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-handler-escaping.py --check builder-set \
            --expect 'admin/frontend/oss-profiles.js:99 actionButton'

      - name: Handler escaping is absolute (Phases 3 and 6) -- wrong-primitive and unescaped-quoted at zero
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-handler-escaping.py --class wrong-primitive --max 0
          python3 scripts/check-handler-escaping.py --class unescaped-quoted --max 0
          python3 scripts/check-handler-escaping.py --class bare-expression --max 169
          python3 scripts/check-handler-escaping.py --check no-nested-replace
          python3 scripts/check-handler-escaping.py --check no-handrolled-escape
          python3 scripts/check-handler-escaping.py --check jsattr-confinement
          python3 scripts/check-handler-escaping.py --check display-shape
          python3 scripts/check-handler-escaping.py --check alias-double-escape
          python3 scripts/check-handler-escaping.py --check app3309
          python3 scripts/check-handler-escaping.py --check mis-context \
            --expect-static 'href-javascript=2' \
            --expect-set-from admin/frontend/.escaping-baseline.json

      - name: Callee-sink table has no unresolved or unescaped sinks (D9)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-callee-sinks.py --class unresolved --max 0
          python3 scripts/check-callee-sinks.py --class sink-unescaped --max 0

      - name: emerging-intents.js LLM-fed fields stay escaped (Phase 4)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-html-template-escaping.py --check primitive-matches-position \
            --file admin/frontend/emerging-intents.js
          # Phase 4 step 4's residual ceiling. The measurer records
          # emerging_intents_raw_text_node_sites=19 but nothing read it, so a NEW
          # raw LLM-fed interpolation under any OTHER field name (intent.rationale,
          # intent.example) was caught by nothing: the primitive-matches-position
          # check above regexes only display_name|canonical_name|description, and
          # neither data-attribute nor innerhtml-sink covers text position.
          # Verified by injecting ${intent.rationale}: this ceiling fires, the
          # other two do not. Found by valerie at final validation.
          python3 scripts/check-html-template-escaping.py \
            --file admin/frontend/emerging-intents.js --class text-node --max 19
          # `--class text-node --max 0` (the plan's original phrasing for this
          # step) is not the right gate: it over-approximates by design (D14)
          # and this file legitimately has ~19 inert/numeric text-node
          # interpolations (occurrence counts, ternary branches) that were
          # never part of the 6 LLM-fed sites this phase closed -- gating the
          # whole file at zero would be permanently unsatisfiable. Assert the
          # specific invariant instead: every display_name/canonical_name/
          # description interpolation in this file is escapeHtml-wrapped,
          # with a population floor (rule 8) so this can't pass on zero
          # matches if the fields were ever renamed out from under it.
          python3 -c 'import re,sys; text=open("admin/frontend/emerging-intents.js",encoding="utf-8").read(); matches=re.findall(r"\$\{([^}]*\b(?:display_name|canonical_name|description)\b[^}]*)\}", text); assert len(matches)>=6, f"population floor not met: expected >= 6, found {len(matches)}"; unescaped=[m for m in matches if not m.strip().startswith("escapeHtml(")]; assert not unescaped, f"raw (non-escapeHtml) interpolation(s): {unescaped}"; print(f"PASS: all {len(matches)} display_name/canonical_name/description interpolations are escapeHtml-wrapped")'

      - name: Forbidden sinks stay at absolute zero (C1)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-html-template-escaping.py --check forbidden-sink

      - name: Wide populations are ratcheted, not fixed (D10) -- ceilings, not zeros
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-html-template-escaping.py --class data-attribute --max 344
          python3 scripts/check-html-template-escaping.py --class innerhtml-sink --max 442

      - name: Three-way wiring parity and buster presence (D7)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-frontend-wiring.py --check three-way
          python3 scripts/check-frontend-wiring.py --check buster-presence

      - name: nginx no longer sends Cache-Control immutable (D12)
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'immutable' admin/frontend/nginx.conf

      - name: Run load-order guard
        shell: bash
        run: |
          set -euo pipefail
          "$ATHENA_NODE_BIN" scripts/check-frontend-escape-load-order.js

      - name: escapeHtml/escapeJsAttr are frozen against runtime overwrite (D13)
        shell: bash
        run: |
          set -euo pipefail
          "$ATHENA_NODE_BIN" scripts/check-frontend-escape-load-order.js --check hardening

      - name: Cache-buster freshness for changed frontend JS
        shell: bash
        run: |
          set -euo pipefail
          # A changed .js whose ?v= did not move never reaches a warm-cache
          # browser — nginx serves .js as `public, immutable`, so not even a
          # user-initiated reload recovers it. Exit 2 means the check could not
          # run and is NOT a pass.
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            python3 scripts/check-frontend-cache-busters.py --base "origin/${GITHUB_BASE_REF}"
          else
            python3 scripts/check-frontend-cache-busters.py
          fi

      - name: No unsanctioned test skips added on this branch
        shell: bash
        run: |
          set -euo pipefail
          # Set-equality against a pinned list, not a flat ban: Phase 1 step 8 is
          # REQUIRED to add D3's skip. Exit 2 (could not run) is NOT a pass.
          python3 scripts/check-no-new-test-skips.py --base "origin/${GITHUB_BASE_REF:-main}"
