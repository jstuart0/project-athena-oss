# =============================================================================
# ALTERNATIVE deployment for jarvis-web in a standalone namespace.
# This file is structurally different from manifests/athena-prod/jarvis-web.yaml
# (different namespace, different service mesh assumptions, Authentik ForwardAuth
# integration). Use this file ONLY if you are deploying jarvis-web independently
# of the canonical athena-prod stack.
# For the canonical deployment, use manifests/athena-prod/jarvis-web.yaml.
#
# Before applying, replace all YOUR_* placeholders with your actual values:
#   YOUR_REGISTRY    - your container registry (e.g., registry.example.com:5000)
#   YOUR_DOMAIN_HERE - your domain (e.g., jarvis.yourdomain.com)
#   YOUR_LOCAL_CIDR  - your LAN CIDR (e.g., 192.168.0.0/16 or 10.0.0.0/8)
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis-web
  labels:
    name: jarvis-web

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-web
  namespace: jarvis-web
  labels:
    app: jarvis-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis-web
  template:
    metadata:
      labels:
        app: jarvis-web
    spec:
      containers:
      - name: jarvis-web
        # REQUIRED: replace YOUR_REGISTRY with your container registry
        # (e.g., registry.example.com:5000/jarvis-web:latest)
        image: YOUR_REGISTRY/jarvis-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        # Orchestrator URL — internal cluster DNS; change only if orchestrator
        # is in a different namespace or cluster.
        - name: ORCHESTRATOR_URL
          value: "http://athena-orchestrator:8001"
        # Admin backend URL
        - name: ADMIN_BACKEND_URL
          value: "http://athena-admin-backend:8080"
        - name: DEFAULT_ROOM
          value: "guest"
        # Home Assistant for climate control (optional)
        - name: HA_URL
          value: ""
        - name: HA_TOKEN
          valueFrom:
            secretKeyRef:
              name: home-assistant-credentials
              key: long-lived-token
              optional: true
        - name: CLIMATE_ENTITY
          value: "climate.thermostat"
        # Guest-safe temperature limits
        - name: MIN_TEMP
          value: "65"
        - name: MAX_TEMP
          value: "75"
        # Voice services (STT/TTS)
        - name: VOICE_API_URL
          value: "http://voice-service:10201"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-web
  namespace: jarvis-web
  labels:
    app: jarvis-web
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: jarvis-web

---
# IngressRoute with conditional authentication
# - Local IPs: No authentication required
# - External IPs: Authentik forward auth required
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jarvis-web-ingressroute
  namespace: jarvis-web
  labels:
    app: jarvis-web
spec:
  entryPoints:
    - websecure
  routes:
    # Route 1: Local network access - NO authentication
    # Higher priority (100) means this route is evaluated first
    # Only local network bypasses auth — pod networks excluded to require tunnel auth
    # REQUIRED: replace YOUR_DOMAIN_HERE with your domain (e.g., jarvis.yourdomain.com)
    # REQUIRED: replace YOUR_LOCAL_CIDR with your LAN's CIDR (e.g., 192.168.0.0/16, 10.0.0.0/8)
    - match: Host(`YOUR_DOMAIN_HERE`) && ClientIP(`YOUR_LOCAL_CIDR`)
      kind: Rule
      priority: 100
      services:
        - name: jarvis-web
          port: 80

    # Route 2: External access - Authentik authentication required
    # Lower priority (10) means this route is evaluated if Route 1 doesn't match
    - match: Host(`YOUR_DOMAIN_HERE`)
      kind: Rule
      priority: 10
      middlewares:
        - name: jarvis-forwardauth
          namespace: jarvis-web
      services:
        - name: jarvis-web
          port: 80
  tls:
    secretName: jarvis-web-tls

---
# HTTP to HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jarvis-web-http-redirect
  namespace: jarvis-web
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`YOUR_DOMAIN_HERE`)
      kind: Rule
      middlewares:
        - name: jarvis-https-redirect
          namespace: jarvis-web
      services:
        - name: jarvis-web
          port: 80
