# =============================================================================
# STANDALONE EXAMPLE — deploys jarvis-web into its own namespace. The
# athena-prod deployment is manifests/athena-prod/jarvis-web.yaml.
#
# This file is structurally different from manifests/athena-prod/jarvis-web.yaml
# (different namespace, different service mesh assumptions, Authentik ForwardAuth
# integration). Use this file ONLY if you are deploying jarvis-web independently
# of the canonical athena-prod stack.
# For the canonical deployment, use manifests/athena-prod/jarvis-web.yaml.
#
# Before applying, replace all YOUR_* placeholders with your actual values:
#   YOUR_REGISTRY    - your container registry (e.g., registry.example.com:5000)
#   YOUR_DOMAIN_HERE - your domain (e.g., jarvis.yourdomain.com)
#   YOUR_LOCAL_CIDR  - your LAN CIDR (e.g., 192.168.0.0/16 or 10.0.0.0/8)
#
# D10: the orchestrator's /query and /query/stream now require X-Service-Key.
# This namespace has no athena-encryption Secret (that's athena-prod's), so
# create a namespace-local one before applying:
#   kubectl -n jarvis-web create secret generic jarvis-web-service-key \
#     --from-literal=SERVICE_API_KEY=<the orchestrator's SERVICE_API_KEY>
#
# If you add manifests/athena-prod/optional/networkpolicy-orchestrator.yaml,
# it needs an additional `from:` entry with a namespaceSelector for this
# namespace and the `app: jarvis-web` label, since that policy otherwise
# only allows same-namespace (athena-prod) callers.
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis-web
  labels:
    name: jarvis-web

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-web
  namespace: jarvis-web
  labels:
    app: jarvis-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis-web
  template:
    metadata:
      labels:
        app: jarvis-web
    spec:
      containers:
      - name: jarvis-web
        # REQUIRED: replace YOUR_REGISTRY with your container registry
        # (e.g., registry.example.com:5000/jarvis-web:latest)
        image: YOUR_REGISTRY/jarvis-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        # Orchestrator URL — this namespace is NOT athena-prod, so the short
        # in-namespace DNS name ("athena-orchestrator") doesn't resolve;
        # use the fully-qualified cross-namespace form.
        # REQUIRED: replace YOUR_ORCHESTRATOR_NAMESPACE (e.g., "athena-prod").
        - name: ORCHESTRATOR_URL
          value: "http://athena-orchestrator.YOUR_ORCHESTRATOR_NAMESPACE.svc.cluster.local:8001"
        # Admin backend URL
        - name: ADMIN_BACKEND_URL
          value: "http://athena-admin-backend:8080"
        # D10: required once the orchestrator's ORCHESTRATOR_INGRESS_AUTH
        # is "enforce" (the default). See the namespace-local Secret
        # creation note in the header banner above.
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: jarvis-web-service-key
              key: SERVICE_API_KEY
        - name: DEFAULT_ROOM
          value: "guest"
        # Home Assistant for climate control (optional)
        - name: HA_URL
          value: ""
        - name: HA_TOKEN
          valueFrom:
            secretKeyRef:
              name: home-assistant-credentials
              key: long-lived-token
              optional: true
        - name: CLIMATE_ENTITY
          value: "climate.thermostat"
        # Kitchen appliance entities (optional). This names a specific
        # appliance model's HA entities -- most deployments don't have
        # these; each /api/appliances/* endpoint reports "not configured"
        # until its own key(s) below are uncommented and set.
        # - name: OVEN_ENTITY_ID
        #   value: "water_heater.your_oven"
        # - name: FRIDGE_ENTITY_ID
        #   value: "water_heater.your_fridge"
        # - name: FREEZER_ENTITY_ID
        #   value: "water_heater.your_freezer"
        # - name: STOVE_COOK_MODE_SENSOR_ID
        #   value: "sensor.stove_cook_mode"
        # - name: STOVE_DISPLAY_TEMP_SENSOR_ID
        #   value: "sensor.stove_display_temperature"
        # - name: STOVE_TIMER_SENSOR_ID
        #   value: "sensor.stove_cook_time_remaining"
        # - name: FRIDGE_DOOR_SENSOR_ID
        #   value: "binary_sensor.refrigerator_door"
        # Guest-safe temperature limits
        - name: MIN_TEMP
          value: "65"
        - name: MAX_TEMP
          value: "75"
        # Voice services (STT/TTS)
        - name: VOICE_API_URL
          value: "http://voice-service:10201"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-web
  namespace: jarvis-web
  labels:
    app: jarvis-web
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: jarvis-web

---
# Edge auth, the same shape as manifests/athena-prod/optional/jarvis-web-edge-auth.yaml
# (read that file's header for the requirements; they apply here too):
# home network without sign-in, everyone else through Authentik, and every
# request attested so jarvis-web knows the class came from this proxy.
# Order: strip -> (forwardAuth) -> attest. Replace CONFIGURE_ME_EDGE_ATTESTATION
# at apply time from the jarvis-edge-attestation Secret; never commit it.
# jarvis-web also needs, in its env above: JARVIS_EDGE_ATTESTATION_SECRET
# (secretKeyRef jarvis-edge-attestation/current, not optional),
# JARVIS_EDGE_ATTESTATION_SECRET_PREVIOUS (key previous, optional: true),
# TRUSTED_PROXY_CIDRS (your Traefik pods), JARVIS_LOCAL_NETWORKS (the same
# CIDR as below), JARVIS_ALLOWED_HOSTS (YOUR_DOMAIN_HERE) and
# JARVIS_HOUSEHOLD_GROUPS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jarvis-edge-strip
  namespace: jarvis-web
spec:
  headers:
    customRequestHeaders:
      X-Jarvis-Edge-Class: ""
      X-Jarvis-Edge-Attestation: ""
      X-authentik-username: ""
      X-authentik-groups: ""
      X-authentik-email: ""
      X-authentik-name: ""
      X-authentik-uid: ""
      X-Service-Key: ""
      X-Jarvis-Relay-Key: ""
      X-Jarvis-Relay-Client: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jarvis-edge-forwardauth
  namespace: jarvis-web
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: false
    authResponseHeadersRegex: "(?i)^x-authentik-"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jarvis-edge-attest-home
  namespace: jarvis-web
spec:
  headers:
    customRequestHeaders:
      X-Jarvis-Edge-Class: "home"
      X-Jarvis-Edge-Attestation: "CONFIGURE_ME_EDGE_ATTESTATION"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jarvis-edge-attest-authenticated
  namespace: jarvis-web
spec:
  headers:
    customRequestHeaders:
      X-Jarvis-Edge-Class: "authenticated"
      X-Jarvis-Edge-Attestation: "CONFIGURE_ME_EDGE_ATTESTATION"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jarvis-web-ingressroute
  namespace: jarvis-web
  labels:
    app: jarvis-web
spec:
  entryPoints:
    - websecure
  routes:
    # O: the outpost's sign-in callback and sign-out, untouched.
    - match: Host(`YOUR_DOMAIN_HERE`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 3000
      services:
        - name: authentik-server
          namespace: authentik
          port: 80
    # H: home network, no Cloudflare headers. REQUIRED: replace YOUR_LOCAL_CIDR.
    - match: Host(`YOUR_DOMAIN_HERE`) && !HeaderRegexp(`Cf-Connecting-Ip`, `.+`) && !HeaderRegexp(`Cf-Ray`, `.+`) && ClientIP(`YOUR_LOCAL_CIDR`)
      kind: Rule
      priority: 900
      middlewares:
        - name: jarvis-edge-strip
        - name: jarvis-edge-attest-home
      services:
        - name: jarvis-web
          port: 80
    # A: everyone else signs in through Authentik.
    - match: Host(`YOUR_DOMAIN_HERE`)
      kind: Rule
      priority: 100
      middlewares:
        - name: jarvis-edge-strip
        - name: jarvis-edge-forwardauth
        - name: jarvis-edge-attest-authenticated
      services:
        - name: jarvis-web
          port: 80
  tls:
    secretName: jarvis-web-tls

---
# HTTP to HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jarvis-web-http-redirect
  namespace: jarvis-web
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`YOUR_DOMAIN_HERE`)
      kind: Rule
      middlewares:
        - name: jarvis-https-redirect
          namespace: jarvis-web
      services:
        - name: jarvis-web
          port: 80
