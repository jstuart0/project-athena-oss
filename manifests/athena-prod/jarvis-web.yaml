---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-jarvis-web
  namespace: athena-prod
  labels:
    app: athena-jarvis-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: athena-jarvis-web
  template:
    metadata:
      labels:
        app: athena-jarvis-web
    spec:
      serviceAccountName: athena-jarvis-web
      automountServiceAccountToken: false
      containers:
      - name: jarvis-web
        image: YOUR_REGISTRY/athena-jarvis-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: athena-config
        env:
        - name: PORT
          value: "8000"
        # DEFAULT_ROOM: OSS template -- commented out, not a tracked value
        # (DC14 item 1d). The backend's own os.getenv("DEFAULT_ROOM",
        # "guest") default applies when this key isn't set at all; the
        # house-specific room name (e.g. "office") is a live-cluster env
        # patch, never a value in this tracked manifest.
        # - name: DEFAULT_ROOM
        #   value: "your-default-room"
        # Kitchen appliance entities (OSS template -- commented out). This
        # names a specific appliance model's HA entities; each
        # /api/appliances/* endpoint reports "not configured" until its
        # own key(s) below are uncommented and set.
        # - name: OVEN_ENTITY_ID
        #   value: "water_heater.your_oven"
        # - name: FRIDGE_ENTITY_ID
        #   value: "water_heater.your_fridge"
        # - name: FREEZER_ENTITY_ID
        #   value: "water_heater.your_freezer"
        # - name: STOVE_COOK_MODE_SENSOR_ID
        #   value: "sensor.stove_cook_mode"
        # - name: STOVE_DISPLAY_TEMP_SENSOR_ID
        #   value: "sensor.stove_display_temperature"
        # - name: STOVE_TIMER_SENSOR_ID
        #   value: "sensor.stove_cook_time_remaining"
        # - name: FRIDGE_DOOR_SENSOR_ID
        #   value: "binary_sensor.refrigerator_door"
        - name: HA_URL
          valueFrom:
            secretKeyRef:
              name: ha-credentials
              key: url
        - name: HA_TOKEN
          valueFrom:
            secretKeyRef:
              name: ha-credentials
              key: token
        - name: MIN_TEMP
          value: "65"
        - name: MAX_TEMP
          value: "75"
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: athena-encryption
              key: SERVICE_API_KEY
        # JARVIS_PUBLIC_MODE (ATHENA-69, D18/D19) -- OSS template, commented
        # out (default "guest" applies). An unauthenticated caller is a
        # guest and refused on every owner_only write route (403
        # sign_in_required). Set to "household" only for a LAN-only
        # deployment not reachable from the internet -- it restores the
        # pre-ATHENA-69 behavior of serving every caller in the household's
        # actual mode and bypasses the write-route sign-in gate. Logs
        # jarvis_public_mode_household_active hourly while active.
        # - name: JARVIS_PUBLIC_MODE
        #   value: "household"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: athena-jarvis-web
  namespace: athena-prod
spec:
  selector:
    app: athena-jarvis-web
  ports:
  - port: 80
    targetPort: 8000
