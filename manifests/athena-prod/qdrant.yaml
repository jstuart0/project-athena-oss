# =============================================================================
# REQUIRED: Set storageClassName below before applying.
#   Run: kubectl get storageclass
#   Then replace YOUR_STORAGE_CLASS with the name that fits your cluster.
#   Common values: standard, gp2, local-path, longhorn, ceph-block
#
# WARNING — PVC immutability: storageClassName is immutable on an existing PVC.
# If you have already applied this file and have a bound qdrant-storage PVC,
# you MUST delete the PVC before re-applying (data will be lost — back up first):
#   kubectl -n athena-prod delete pvc qdrant-storage
#   kubectl apply -f manifests/athena-prod/qdrant.yaml
# =============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: athena-prod
  labels:
    app: qdrant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: YOUR_STORAGE_CLASS  # REQUIRED: set to your cluster's StorageClass (run: kubectl get storageclass)
  resources:
    requests:
      storage: 20Gi
---
# Qdrant Vector Database for Athena Memory System
# Provides semantic search capabilities for memory retrieval
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: athena-prod
  labels:
    app: qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.12.1
        ports:
        - name: http
          containerPort: 6333
        - name: grpc
          containerPort: 6334
        env:
        - name: QDRANT__SERVICE__HTTP_PORT
          value: "6333"
        - name: QDRANT__SERVICE__GRPC_PORT
          value: "6334"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
        livenessProbe:
          httpGet:
            path: /healthz
            port: 6333
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 6333
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      # Production (default): persistent storage via PVC
      - name: qdrant-storage
        persistentVolumeClaim:
          claimName: qdrant-storage
      # Development / ephemeral testing alternative (uncomment and remove the PVC reference above to use):
      # - name: qdrant-storage
      #   emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: athena-prod
  labels:
    app: qdrant
spec:
  selector:
    app: qdrant
  ports:
  - name: http
    port: 6333
    targetPort: 6333
  - name: grpc
    port: 6334
    targetPort: 6334
