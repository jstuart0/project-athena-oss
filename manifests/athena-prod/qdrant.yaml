# =============================================================================
# REQUIRED: Set storageClassName below before applying.
#   Run: kubectl get storageclass
#   Then replace YOUR_STORAGE_CLASS with the name that fits your cluster.
#   Common values: standard, gp2, local-path, longhorn, ceph-block
#
# WARNING — PVC immutability: storageClassName is immutable on an existing PVC.
# If you have already applied this file and have a bound qdrant-storage PVC,
# you MUST delete the PVC before re-applying (data will be lost — back up first):
#   kubectl -n athena-prod delete pvc qdrant-storage
#   kubectl apply -f manifests/athena-prod/qdrant.yaml
# =============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: athena-prod
  labels:
    app: qdrant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: YOUR_STORAGE_CLASS  # REQUIRED: set to your cluster's StorageClass (run: kubectl get storageclass)
  resources:
    requests:
      storage: 20Gi
---
# Qdrant Vector Database for Athena Memory System
# Provides semantic search capabilities for memory retrieval
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: athena-prod
  labels:
    app: qdrant
spec:
  replicas: 1
  # One pod on a ReadWriteOnce volume: a rolling update would start the new
  # pod while the old one still holds the volume, and it would never become
  # ready. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      serviceAccountName: qdrant
      automountServiceAccountToken: false
      containers:
      - name: qdrant
        # Pinned 2026-09-28 (ATHENA-126): v1.19.1 is the current stable release
        # (Docker Hub, published 2026-09-03; GitHub releases/latest confirms no gap).
        #
        # FRESH INSTALL (no existing collections): deploy this version directly.
        # There is no on-disk state to migrate, so v1.19.1 starts clean.
        #
        # *** UPGRADE WARNING — IRREVERSIBLE ON-DISK MIGRATIONS ***
        # A deployment with EXISTING collections must not jump straight to this
        # tag from an older pin. Per Qdrant's storage-compatibility policy, upgrade
        # one minor version at a time (e.g. 1.12→1.13→1.14→...→1.19) — skipping
        # minors is unsupported and can corrupt or strand on-disk data. Two of the
        # steps in that walk are themselves one-way:
        #   • v1.15.4: shard-key format change (qdrant PR #7110)
        #   • v1.16.1: RocksDB backend replaced by Gridstore (qdrant PR #7551)
        # Each one-way migration runs automatically on first successful start at
        # the new version and cannot be undone by reverting the image tag alone;
        # reverting after a successful start at a post-migration version will
        # crash-loop the container (incompatible on-disk format).
        #
        # Before upgrading a populated instance:
        #   1. Snapshot the qdrant-storage PVC (e.g. via VolumeSnapshot or storage-class backup)
        #   2. Verify the snapshot is restorable
        #   3. Walk the image tag one minor version at a time, letting each one fully
        #      start and pass /readyz before moving to the next
        #   4. Only once at the latest prior minor, move to this tag
        # Review release notes: https://github.com/qdrant/qdrant/releases/tag/v1.19.1
        #
        # NOTE: This is a single-replica Deployment. "Upgrade" means stop-then-start — there
        # is no rolling upgrade; the pod is replaced in full.
        image: qdrant/qdrant:v1.19.1
        ports:
        - name: http
          containerPort: 6333
        - name: grpc
          containerPort: 6334
        env:
        - name: QDRANT__SERVICE__HTTP_PORT
          value: "6333"
        - name: QDRANT__SERVICE__GRPC_PORT
          value: "6334"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
        # startupProbe gates both liveness and readiness until Qdrant is ready.
        # failureThreshold*periodSeconds = 120 s of grace covers the one-time
        # Gridstore migration that runs on first start at v1.18.x.
        startupProbe:
          httpGet:
            path: /readyz
            port: 6333
          failureThreshold: 12
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 6333
          # No initialDelaySeconds — startupProbe gates liveness until pod is ready.
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 6333
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      # Production (default): persistent storage via PVC
      - name: qdrant-storage
        persistentVolumeClaim:
          claimName: qdrant-storage
      # Development / ephemeral testing alternative (uncomment and remove the PVC reference above to use):
      # - name: qdrant-storage
      #   emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: athena-prod
  labels:
    app: qdrant
spec:
  selector:
    app: qdrant
  ports:
  - name: http
    port: 6333
    targetPort: 6333
  - name: grpc
    port: 6334
    targetPort: 6334
