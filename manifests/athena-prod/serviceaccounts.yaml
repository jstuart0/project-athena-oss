# ServiceAccounts for athena-prod workloads.
#
# NO Roles or RoleBindings are defined here — by design. No athena-prod workload
# calls the Kubernetes API (verified: grep for kubernetes_asyncio / in-cluster
# config returns zero hits in src/ and admin/). These SAs exist solely to:
#   (a) stop pods from binding the shared `default` ServiceAccount, and
#   (b) disable automounting of the default SA token on every pod.
#
# automountServiceAccountToken: false is set on BOTH the SA object and each
# Deployment's spec.template.spec (D3 — defense-in-depth).
#
# The 12th SA (`cloudflared`, namespace: cloudflare) lives in
# optional/cloudflare-tunnels.yaml next to its Namespace object (D10) — NOT here.
# A `namespace: cloudflare` SA in this file would fail if applied before that
# namespace exists; co-location in the optional file guarantees ordering.
#
# Apply runbook: apply this file BEFORE any Deployment manifests so the SA
# objects exist when pods are scheduled. See the plan apply runbook for the
# full ordering (deferred until ATHENA-58 is resolved).
---
# Core services
apiVersion: v1
kind: ServiceAccount
metadata:
  name: athena-admin-backend
  namespace: athena-prod
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: athena-admin-frontend
  namespace: athena-prod
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: athena-orchestrator
  namespace: athena-prod
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: athena-gateway
  namespace: athena-prod
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: athena-mode-service
  namespace: athena-prod
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: athena-jarvis-web
  namespace: athena-prod
automountServiceAccountToken: false
---
# Data / inference services
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: athena-prod
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant
  namespace: athena-prod
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollama
  namespace: athena-prod
automountServiceAccountToken: false
---
# Shared RAG ServiceAccount — used by all 23 RAG Deployments (D2).
# All 23 RAG pods have identical RBAC needs (none). One SA keeps the profile
# severable if any pod later needs a Role; converting to per-service SAs
# at that point is a mechanical Deployment-spec change.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: athena-rag
  namespace: athena-prod
automountServiceAccountToken: false
---
# Job ServiceAccount — separate from the `ollama` Deployment SA (1.4 rationale).
# The model-pull Job and the Ollama Deployment have independent lifecycles;
# a dedicated SA keeps their (currently empty) permission profiles severable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollama-model-pull
  namespace: athena-prod
automountServiceAccountToken: false
