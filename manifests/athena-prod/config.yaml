---
apiVersion: v1
kind: ConfigMap
metadata:
  name: athena-config
  namespace: athena-prod
data:
  # ==========================================================================
  # WARNING: OSS TEMPLATE WITH PLACEHOLDERS. A configured namespace's live
  # ConfigMap carries deployment-specific values (DEFAULT_CITY,
  # TRUSTED_PROXY_CIDRS, TRANSIT_*, COMMUNITY_EVENTS_SOURCES,
  # MUSIC_ASSISTANT_URL, DEFAULT_AMTRAK_STATION, SEARXNG_BASE_URL,
  # ORCHESTRATOR_INGRESS_AUTH) that are not here. NEVER `kubectl apply -f`
  # this file (or the manifests/athena-prod/ directory) against a configured
  # namespace; change a live ConfigMap with `kubectl patch`/`kubectl edit`
  # or a private overlay.
  # ==========================================================================
  # Every key the code reads (AthenaConfig fields + DEFAULT_STATE), listed
  # here as commented placeholders so a blind `kubectl apply -f` can never
  # silently clobber a deployment-specific value with an absent key. Set the
  # ones you need by uncommenting; leave the rest commented to keep the
  # AthenaConfig default.
  # COMMUNITY_EVENTS_SOURCES: ""
  # CONTENT_FETCHER_ALLOW_BROWSER_FETCH: ""
  # CONTROL_AGENT_ENABLED: ""
  # DATABASE_URL: ""
  # DEFAULT_AMTRAK_STATION: ""
  # DEFAULT_CITY: ""
  # DEFAULT_STATE: ""
  # DEFAULT_TIMEZONE: ""
  # DEMO_MODE: ""
  # DEV_MODE: ""
  # GUEST_BASELINE_ALLOWED_DOMAINS: ""
  # GUEST_BASELINE_ALLOWED_INTENTS: ""
  # GUEST_BASELINE_RESTRICTED_ENTITIES: ""
  # HA_BED_WARMER_ENTITIES: ""
  # HA_LIGHT_GROUPS: ""
  # HA_MUSIC_PLAYERS: ""
  # HA_PERMISSION_FALLBACK_RESTRICTED_ENTITIES: ""
  # HA_SATELLITE_ROOM_MAP: ""
  # HA_TV_ENTITIES: ""
  # HA_WRITE_FANOUT_CONFIRM_THRESHOLD: ""
  # HA_WRITE_FANOUT_HARD_LIMIT: ""
  # HEALTH_POLL_ALLOWED_PRIVATE_HOSTS: ""
  # HEALTH_POLL_CONCURRENCY: ""
  # HEALTH_POLL_INTERVAL_SECONDS: ""
  # HEALTH_POLL_TIMEOUT_SECONDS: ""
  # JARVIS_WEB_URL: ""
  # LIVEKIT_USER_TOKEN_TTL_MINUTES: ""
  # LLM_SERVICE_URL: ""
  # LOGIN_LOCKOUT_MINUTES: ""
  # LOGIN_LOCKOUT_THRESHOLD: ""
  # LOGIN_MINIMUM_DELAY_MS: ""
  # LOGIN_RATE_LIMIT_PER_MINUTE: ""
  # MODE_BOOKINGS_MAX_AGE_SECONDS: ""
  # MODE_BOOKINGS_SOURCE: ""
  # MODE_OVERRIDE_LOCKOUT_MINUTES: ""
  # MODE_OVERRIDE_LOCKOUT_THRESHOLD: ""
  # MODE_SERVICE_INGRESS_AUTH: ""
  # MODE_SERVICE_URL: ""
  # MUSIC_ASSISTANT_URL: ""
  # NEW_CONVERSATION_PER_MINUTE_PER_IP: ""
  # NEW_CONVERSATION_RESET_GRACE_SECONDS: ""
  # OIDC_CLIENT_ID: ""
  # OIDC_ISSUER: ""
  # OIDC_VALIDATE_ISS: ""
  # OLLAMA_URL: ""
  # ORCHESTRATOR_INGRESS_AUTH: ""
  # REDIS_URL: ""
  # SEARXNG_BASE_URL: ""
  # SERVICE_API_KEY: ""
  # SERVICE_CONTROL_K8S_ENABLED: ""
  # SERVICE_REGISTRY_ENDPOINT_URL: ""
  # SERVICE_REGISTRY_NAME: ""
  # SERVICE_REGISTRY_WRITE_PER_MINUTE: ""
  # SESSION_MAX_COUNT: ""
  # SITESCRAPER_ALLOWED_PRIVATE_HOSTS: ""
  # TRANSIT_GTFS_FEEDS: ""
  # TRANSIT_REGION_NAME: ""
  # TRANSIT_STATIC_SERVICES: ""
  # TRUSTED_PROXY_CIDRS: ""
  # ==========================================================================
  # LLM Backend Configuration
  # ==========================================================================
  # Choose one of the following options:
  #
  # Option 1: In-cluster Ollama (default, for testing)
  #   OLLAMA_URL: "http://ollama:11434"
  #
  # Option 2: External Ollama server
  #   OLLAMA_URL: "http://<server-ip>:11434"
  #
  # Option 3: MLX-LM on Apple Silicon (OpenAI-compatible)
  #   OLLAMA_URL: "http://<mac-ip>:8080/v1"
  #
  # Option 4: OpenAI API
  #   OLLAMA_URL: "https://api.openai.com/v1"
  #   (Also set OPENAI_API_KEY in secrets)
  #
  # Both Ollama and MLX-LM provide OpenAI-compatible APIs.
  #
  # IMPORTANT: an in-cluster Ollama (Option 1, the default below) needs its
  # Service hostname or ClusterIP CIDR added to HEALTH_POLL_ALLOWED_PRIVATE_HOSTS
  # above (currently commented out) -- otherwise model discovery, voice
  # tests, and the Service Control Ollama panel all refuse with
  # ssrf_blocked. Bare-metal/external Ollama (Options 2-4) resolved outside
  # a K8s pod does NOT need this entry for model discovery/voice tests
  # (automatic local-dev carve-out), but the Service Control panel and the
  # settings reachability check still require it. Uncomment and set, e.g.:
  #   HEALTH_POLL_ALLOWED_PRIVATE_HOSTS: "ollama"
  # See docs/CONFIGURATION.md "Ollama (LLM)" for the full rule.
  # ==========================================================================
  OLLAMA_URL: "http://ollama:11434"

  # ==========================================================================
  # LLM Model Configuration (OSS Defaults)
  # ==========================================================================
  # Default model for all orchestrator components. On first startup:
  #   1. Database is seeded with LLM backend and component assignments
  #   2. Model is auto-pulled from Ollama if not already available
  #
  # Recommended models (quality vs speed tradeoff):
  #   - qwen3:4b (default) - Best balance for most tasks
  #   - phi3:mini          - Faster but less capable
  #   - llama3.2:3b        - Good alternative
  #
  # Set ATHENA_SEED_DEFAULTS to "false" to skip automatic database seeding
  # Set ATHENA_AUTO_PULL_MODELS to "false" to skip automatic model downloading
  # ==========================================================================
  ATHENA_DEFAULT_MODEL: "qwen3:4b-instruct-2507-q4_K_M"
  ATHENA_SEED_DEFAULTS: "true"
  ATHENA_AUTO_PULL_MODELS: "true"

  # Service URLs (internal cluster DNS - usually no need to change)
  ADMIN_API_URL: "http://athena-admin-backend:8080"
  GATEWAY_URL: "http://athena-gateway:8000"
  ORCHESTRATOR_URL: "http://athena-orchestrator:8001"
  REDIS_URL: "redis://redis:6379/0"
  # community_events uses DB 1 to isolate its cache from other services.
  # The DB index is encoded in the path so redis.from_url() reads it unambiguously.
  COMMUNITY_EVENTS_REDIS_URL: "redis://redis:6379/1"
  QDRANT_URL: "http://qdrant:6333"

  # MLX-LM server (optional - for Apple Silicon acceleration)
  # Set to your Mac's IP if running MLX-LM server
  # Leave empty or comment out if not using MLX
  MLX_URL: ""

  # ==========================================================================
  # Domain Configuration
  # ==========================================================================
  # Update these to match your domain. Used by services for URLs/redirects.
  # For local-only deployment, use any domain and add to /etc/hosts:
  #   127.0.0.1 athena.local chat.local
  # ==========================================================================
  ATHENA_DOMAIN: "athena.local"
  CHAT_DOMAIN: "chat.local"
  FRONTEND_URL: "https://athena.local"

  # CORS allowed origins for the admin backend (comma-separated)
  # Override with your actual domain in production, e.g. https://athena.example.com
  CORS_ALLOWED_ORIGINS: "http://localhost:8080"

  # Twilio SMS webhooks (optional). If TWILIO_AUTH_TOKEN is set (put it in a
  # Secret, not this ConfigMap), TWILIO_WEBHOOK_BASE_URL is REQUIRED: the public
  # base Twilio calls, matching the Twilio console URL without
  # /api/sms/webhook/..., any #fragment, or user:password@. Otherwise the
  # webhooks answer 503. The Admin UI "Auth Token" field doesn't configure this
  # (ATHENA-75). See .env.example.
  # TWILIO_WEBHOOK_BASE_URL: "https://athena.example.com"

  # Feature flags
  DEMO_MODE: "false"
  MODULE_HOME_ASSISTANT: "true"
  MODULE_GUEST_MODE: "true"
  MODULE_NOTIFICATIONS: "true"
  MODULE_JARVIS_WEB: "true"
  MODULE_MONITORING: "false"

  # Control Agent — optional service that manages Ollama and other host-level
  # processes (runs on the same host as Ollama, outside the cluster).
  # Set this to the URL of your Control Agent if deployed, e.g.:
  #   CONTROL_AGENT_URL: "http://192.168.1.100:8099"
  # When unset, services fall back to http://localhost:8099.
  # Do NOT set this to an empty string — unset the key entirely to use the default.
  #
  # Control Agent is opt-in (default disabled). Enable only if you run a Control
  # Agent process on a host alongside Ollama (e.g., an Apple Silicon Mac or bare-metal node).
  # Existing deployments must add CONTROL_AGENT_ENABLED=true via a private overlay
  # or in-cluster env injection. See docs/INSTALLATION.md for operator instructions.
  #
  # CONTROL_AGENT_ENABLED: "true"
  # CONTROL_AGENT_URL: "http://your-control-agent-host:8099"

  # Service Control on Kubernetes (ATHENA-118) — opt-in. When true, admin-
  # backend's Service Control page can start/stop/restart RAG and core
  # Deployments directly via the Kubernetes scale subresource, in addition
  # to (or instead of) the Control Agent. Requires:
  #   1. manifests/athena-prod/optional/admin-backend-rbac.yaml applied
  #      (namespaced Role: `deployments` list, `deployments/scale`
  #      get/patch, scoped to a fixed list of Deployment names — no pod-
  #      template write, ever);
  #   2. manifests/athena-prod/optional/admin-backend-k8s-control.patch.yaml
  #      applied (mounts a token for the athena-admin-backend ServiceAccount
  #      — the base admin-backend.yaml deliberately keeps automount off).
  # Without both, the flag is inert: the page falls back to "managed
  # externally" per row and shows a banner if the flag is on but the
  # client can't be built. See docs/CONFIGURATION.md § Service Control on
  # Kubernetes for the full opt-in runbook, restart semantics (scale-to-0
  # then back — brief downtime, not rolling), and the re-run-the-patch-
  # after-reapply warning.
  # SERVICE_CONTROL_K8S_ENABLED: "true"

  # Local-login brute-force defenses (ATHENA-14) — uncomment to override defaults.
  # Per-IP rate limit on POST /api/auth/local-login (Redis-backed, ignores
  # X-Forwarded-For).  Set to "0" to disable rate limiting; lockout + timing
  # floor still apply.  Default: 5 requests per minute per IP.
  # LOGIN_RATE_LIMIT_PER_MINUTE: "5"
  #
  # Per-username lockout threshold (cumulative wrong-password attempts before
  # the account is locked).  Lockout is idempotent — past-threshold attempts
  # do not extend the window.  Default: 10 failures.
  # LOGIN_LOCKOUT_THRESHOLD: "10"
  #
  # Lockout window in minutes.  Lock self-expires lazily on the next attempt
  # after the window passes.  Manual unlock via psql:
  #   UPDATE users SET failed_login_count=0, locked_until=NULL WHERE username='<name>';
  # Default: 30 minutes.
  # LOGIN_LOCKOUT_MINUTES: "30"
  #
  # Wall-time floor (milliseconds) on every failure branch of local-login.
  # All four paths (not-found, inactive, locked, wrong-password) sleep until
  # elapsed >= floor after dummy-hash.  Raise on slow hardware if timing
  # side-channel is a concern.  Default: 400ms.
  # LOGIN_MINIMUM_DELAY_MS: "400"

  # Service-registry write rate limit (ATHENA-1 Phase 2).
  # Separate token bucket from LOGIN_RATE_LIMIT_PER_MINUTE.  Covers
  # POST/toggle/refresh/DELETE on /api/service-registry/services/*.
  # Default 60 (accommodates CA's per-service upsert loop on startup).
  # SERVICE_REGISTRY_WRITE_PER_MINUTE: "60"

  # ==========================================================================
  # Health Poller Configuration (ATHENA-1 Phase 4)
  # ==========================================================================
  # Background task that polls each enabled RAG service's /health endpoint on
  # a schedule and caches results in athena_service_registry.health_status + related
  # columns. The admin UI reads cached values instead of inline-pinging.
  #
  # HEALTH_POLL_INTERVAL_SECONDS: seconds between full poll cycles. Default 30.
  # HEALTH_POLL_INTERVAL_SECONDS: "30"
  #
  # HEALTH_POLL_TIMEOUT_SECONDS: per-request HTTP timeout. Default 5.
  # HEALTH_POLL_TIMEOUT_SECONDS: "5"
  #
  # HEALTH_POLL_CONCURRENCY: max simultaneous outbound pings per cycle. Default 8.
  # HEALTH_POLL_CONCURRENCY: "8"
  #
  # HEALTH_POLL_ALLOWED_PRIVATE_HOSTS: comma-separated CIDRs or hostnames that
  # override the SSRF block on RFC1918 / loopback / link-local ranges.
  # Default empty = fail-closed (OSS deployers with public-internet services
  # don't need this). Homelab / K8s operators whose services are on private
  # subnets MUST set this to permit the poller to reach them.
  #
  # Example for a standard K8s cluster:
  #   HEALTH_POLL_ALLOWED_PRIVATE_HOSTS: "10.96.0.0/12,10.244.0.0/16"
  # Example with a host subnet (pod CIDR + service CIDR + host subnet):
  #   HEALTH_POLL_ALLOWED_PRIVATE_HOSTS: "10.96.0.0/12,10.244.0.0/16,192.0.2.0/24"
  #
  # This same allowlist gates the in-cluster Ollama probes too -- see the
  # "LLM Backend Configuration" IMPORTANT note above.
  #
  # HEALTH_POLL_ALLOWED_PRIVATE_HOSTS: ""

  # ==========================================================================
  # SSRF guard — ATHENA-59 Phase 0
  # ==========================================================================

  # SITESCRAPER_ALLOWED_PRIVATE_HOSTS: comma-separated hostnames or CIDRs that
  # the SSRF guard (validate_url_not_private) will permit for sitescraper,
  # iCal, and MCP Class-1 URL fetch paths.  Default empty = fail-closed.
  # Homelab operators whose iCal servers or MCP endpoints are on private IPs
  # MUST set this; public-internet deployments leave it empty.
  # Example: SITESCRAPER_ALLOWED_PRIVATE_HOSTS: "192.0.2.0/24,my-ical.local"
  #
  # SITESCRAPER_ALLOWED_PRIVATE_HOSTS: ""

  # CONTENT_FETCHER_ALLOW_BROWSER_FETCH: set to "true" to re-enable the
  # Playwright headless-browser fallback in ContentFetcher for JS-rendered pages.
  # Default false (disabled) — the browser path cannot be per-hop SSRF guarded
  # until egress NetworkPolicy lands (R3 residual, ATHENA-59).
  # Only enable if you accept the residual risk and have deployed Playwright.
  # Example: CONTENT_FETCHER_ALLOW_BROWSER_FETCH: "true"
  #
  # CONTENT_FETCHER_ALLOW_BROWSER_FETCH: "false"

  # ==========================================================================
  # OpenAI-compatible session lifecycle (ATHENA-88 / F88, F39, F38)
  # ==========================================================================

  # SESSION_MAX_COUNT: cap on concurrent per-conversation OpenAI sessions
  # (both the in-memory fallback dict and the Redis creation-time index).
  # Once exceeded, the oldest session is evicted. Default 5000.
  # SESSION_MAX_COUNT: "5000"

  # NEW_CONVERSATION_PER_MINUTE_PER_IP: gateway-side sliding-window limit on
  # *new* conversations (first-turn requests with no explicit session_id)
  # per rate-limit key (see TRUSTED_PROXY_CIDRS below). Default 120.
  # NEW_CONVERSATION_PER_MINUTE_PER_IP: "120"

  # TRUSTED_PROXY_CIDRS: comma-separated CIDRs/hosts. The gateway's
  # new-conversation limiter trusts X-Forwarded-For's original-client
  # address only when the immediate TCP peer falls inside one of these
  # ranges (parsed right-to-left; the nearest hop NOT in this set wins).
  # Keep this scoped to your actual reverse-proxy subnet, not a broad
  # cluster-wide default. Empty (default) means every caller's peer address
  # is used directly (the gateway logs trusted_proxy_cidrs_unset once at
  # startup). Example for a flannel/kubeadm-default cluster's pod CIDR:
  # TRUSTED_PROXY_CIDRS: "10.244.0.0/16"

  # ORCHESTRATOR_INGRESS_AUTH (D10): "enforce" (default) requires
  # X-Service-Key on the orchestrator's query/session routes; a wrong key
  # is always 401. "warn" logs orchestrator_unauthenticated_request and
  # allows the request -- use temporarily to find a caller a header
  # rollout missed. Any other value behaves as "enforce" and logs an ERROR.
  # ORCHESTRATOR_INGRESS_AUTH: "enforce"

  # NEW_CONVERSATION_RESET_GRACE_SECONDS: a first-turn fingerprint reset is
  # skipped when a session under the same fingerprint was created within
  # this many seconds (covers HA's truncated-ASR-retry resend of the same
  # opener). Default 120.
  # NEW_CONVERSATION_RESET_GRACE_SECONDS: "120"

  # ==========================================================================
  # Mode and permissions (ATHENA-69) — see docs/CONFIGURATION.md
  # "Mode and permissions" for the full model.
  # ==========================================================================

  # MODE_SERVICE_INGRESS_AUTH (D15/D23): same three-value contract as
  # ORCHESTRATOR_INGRESS_AUTH above, applied to the mode service's /mode*
  # routes via shared.service_ingress_auth. Code default is "enforce" --
  # left commented here so a fresh OSS install runs it from the start, not
  # "warn" forever. Uncomment temporarily to "warn" ONLY during a staged
  # rollout onto an already-running deployment (e.g. an upgrade where the
  # orchestrator/gateway haven't picked up SERVICE_API_KEY yet) -- the mode
  # service logs mode_service_ingress_auth_warn_active at startup and
  # hourly while "warn" is active, so it's easy to notice the override is
  # still in effect. Remove this line (back to commented) once every
  # caller is confirmed sending X-Service-Key.
  # MODE_SERVICE_INGRESS_AUTH: "warn"

  # LIVEKIT_USER_TOKEN_TTL_MINUTES (D27): TTL for browser-facing LiveKit
  # room tokens minted for jarvis-web voice sessions (clamped 1-1440).
  # Server-side Athena participant tokens are unaffected (explicit 24h TTL).
  # A shorter TTL only bounds *joining* a room; it doesn't disconnect an
  # already-connected participant. Default 30.
  # LIVEKIT_USER_TOKEN_TTL_MINUTES: "30"

  # Guest permission baselines and the mode-service-outage fallback
  # (D4/D8/D22) — comma-separated-array or JSON-array env vars, parsed by
  # shared.guest_policy.parse_json_array_env. Unset or malformed falls back
  # to the built-in default list (never an empty list, which would silently
  # disable a floor); an explicit "[]" is honoured as an intentional
  # deployer opt-out and is logged once at startup
  # (ha_permission_fallback_disabled).
  #
  # HA_PERMISSION_FALLBACK_RESTRICTED_ENTITIES: entity-id regex patterns
  # applied when the mode service is unreachable or rejecting -- the
  # "degraded" permission set. Default restricts locks, covers, alarm
  # panels, cameras, automations, scripts, and scenes; lights/climate/media
  # stay usable.
  # HA_PERMISSION_FALLBACK_RESTRICTED_ENTITIES: '[]'
  #
  # GUEST_BASELINE_RESTRICTED_ENTITIES: the floor unioned into every guest's
  # restricted_entities regardless of admin config -- same domain set as
  # the fallback list above, always unioned in, never replaced by an
  # admin-configured list.
  # GUEST_BASELINE_RESTRICTED_ENTITIES: '[]'
  #
  # GUEST_BASELINE_ALLOWED_INTENTS / GUEST_BASELINE_ALLOWED_DOMAINS: used
  # only when the admin-configured guest allowlist is empty -- an empty
  # admin list means "use this baseline", never "allow everything".
  # GUEST_BASELINE_ALLOWED_INTENTS: '["weather","time","general_info","news","recipes","streaming"]'
  # GUEST_BASELINE_ALLOWED_DOMAINS: '["light","media_player","switch","climate"]'
  #
  # MODE_OVERRIDE_LOCKOUT_THRESHOLD / MODE_OVERRIDE_LOCKOUT_MINUTES (D16/
  # D25): read by the admin backend's per-tier owner-PIN lockout counter
  # (POST /api/internal/guest-mode/verify-pin) -- after this many failed
  # verifications in a trust tier within the lockout window, that tier is
  # locked out for this many minutes. Not read by the mode service, which
  # holds no PIN state after D25. Defaults 5 and 30.
  # MODE_OVERRIDE_LOCKOUT_THRESHOLD: "5"
  # MODE_OVERRIDE_LOCKOUT_MINUTES: "30"

  # MODE_BOOKINGS_SOURCE (ATHENA-127 D1): which booking source(s) the mode
  # service reads to decide guest vs owner. "auto" (default, code default --
  # left commented so a fresh install starts there): admin is required, the
  # legacy CALENDAR_URL iCal feed (if the Guest Mode page has one set) is
  # advisory-additive. "admin": admin only. "ical": the legacy iCal URL is
  # the only, required, source.
  # MODE_BOOKINGS_SOURCE: "auto"

  # MODE_BOOKINGS_MAX_AGE_SECONDS (D6): how long a booking source's last
  # successful fetch is trusted before it's classified "expired" (at which
  # point the house goes degraded rather than trusting stale-forever data).
  # Clamped at use to [max(300, 2x the iCal poll interval), 604800]. Default
  # 21600 (6h). The runtime lever during an admin-backend outage (R2):
  # `kubectl -n athena-prod set env deploy/athena-mode-service
  # MODE_BOOKINGS_MAX_AGE_SECONDS=<n>` (this restarts the pod, so it only
  # helps once the outage is already over -- the restart itself loses
  # last-good state).
  # MODE_BOOKINGS_MAX_AGE_SECONDS: "21600"

  # Also note: DEFAULT_TIMEZONE (Personalization section above) governs how
  # date-only and floating booking times are localised into real instants
  # (D4/D5) for BOTH admin-backend's calendar sync and the mode service's
  # own legacy-iCal parsing. Changing it requires restarting both
  # deployments, then a re-sync (per-source or "Sync all" on the Calendar
  # Sources page). The admin UI's mode-status panel (GET
  # /api/guest-mode/mode-status) also needs HEALTH_POLL_ALLOWED_PRIVATE_HOSTS
  # (Networking section) to cover the mode service's ClusterIP/CIDR, or it
  # reports "ssrf_blocked" instead of the live mode.

  # OVERRIDE_MAX_TIMEOUT_MINUTES (ATHENA-69 Pass H2, xander delta review,
  # High): server-side ceiling on POST /mode/override's timeout_minutes,
  # applied regardless of PIN outcome -- a caller-supplied value above this
  # is clamped, never rejected. Default 240 (4 hours).
  # OVERRIDE_MAX_TIMEOUT_MINUTES: "240"

  # jarvis-web's home network (JARVIS_LOCAL_NETWORKS, JARVIS_GUEST_NETWORKS,
  # JARVIS_LOCAL_EXCLUDE, JARVIS_ALLOWED_HOSTS) is set on the
  # athena-jarvis-web Deployment, not here -- see jarvis-web.yaml. It also
  # reads TRUSTED_PROXY_CIDRS above to find the hop the proxy appended.

  # Logging
  LOG_LEVEL: "INFO"
